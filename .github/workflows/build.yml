name: build
on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: sniffa-studio/.github/actions/s3-artifact@main
        with:
          mode: upload
          name: jars
          path: build/libs/
          archive: "false"
          link: "true"
          endpoint: ${{ vars.CI_S3_ENDPOINT }}
          access-key: ${{ secrets.CI_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.CI_S3_SECRET_KEY }}
